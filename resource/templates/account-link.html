<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YYB Go 账号授权</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172529;background:#f3f7f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.panel{width:min(440px,100%);background:#fff;border:1px solid #d9e3e5;border-radius:16px;padding:24px;box-shadow:0 16px 40px rgba(27,55,61,.08);text-align:center}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:#152d35;color:#fff;font-weight:800;margin:0 auto 14px}.panel h1{font-size:21px;margin:0}.panel p{font-size:13px;color:#718084;line-height:1.6;margin:9px 0 18px}.notice{margin:0 0 16px;padding:12px 14px;border:1px solid #f0c36a;border-radius:10px;background:#fff8e6;color:#76520c;font-size:13px;line-height:1.55;text-align:left}.notice strong{display:block;color:#8d5800;margin-bottom:2px}.qr{width:260px;height:260px;margin:0 auto 16px;border:1px solid #e1e9ea;border-radius:12px;display:grid;place-items:center;background:#fafcfc;color:#77868a;font-size:13px;overflow:hidden}.qr img{width:100%;height:100%;object-fit:contain;border-radius:11px;user-select:none;-webkit-user-drag:none}.state{min-height:24px;color:#4e666a;font-size:13px}.state.error{color:#a53b30}.state.ok{color:#2f7d46}.expiry{min-height:20px;margin-top:3px;color:#8a6a28;font-size:12px}.hint{margin-top:18px;padding:11px 12px;border-radius:9px;background:#f0f7f7;color:#547174;font-size:12px;text-align:left}.btn{width:100%;border:0;border-radius:9px;background:#287f7b;color:#fff;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55;cursor:default}.hidden{display:none!important}
  </style>
</head>
<body>
  <main class="panel">
    <div class="mark">YB</div>
    <h1>YYB Go 账号授权</h1>
    <p id="intro">这是一次性扫码授权链接，扫码账号不匹配时不会写入任何账号数据。</p>
    <div class="notice"><strong>仅限现场扫码</strong>请直接使用微信扫一扫完成授权，不要保存、转发或从相册识别二维码。刷新页面只会重新生成二维码，不会提前消耗授权链接。</div>
    <div class="qr" id="qr">正在生成二维码…</div>
    <div class="state" id="state">链接校验中</div>
    <div class="expiry" id="expiry"></div>
    <button class="btn hidden" id="retry" type="button">重新生成二维码</button>
    <div class="hint">请确认微信中登录的是要授权的账号。链接只能成功使用一次，并会在有效期结束后自动失效。</div>
  </main>
  <script>
    const token=location.pathname.split('/').filter(Boolean).pop();
    const $=id=>document.getElementById(id);let sid='',timer=null,expiryTimer=null,busy=false,linkExpiresAt=0;
    async function api(path,options={}){const response=await fetch(`/account-link/${encodeURIComponent(token)}${path}`,{cache:'no-store',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const text=await response.text();let data;try{data=text?JSON.parse(text):null}catch{throw new Error(`服务返回异常（HTTP ${response.status}）`)}if(!response.ok)throw new Error(data?.msg||'链接已失效或授权失败');return data.data??data}
    function setState(text,kind=''){ $('state').textContent=text;$('state').className=`state ${kind}` }
    function stop(){if(timer){clearInterval(timer);timer=null}}
    function renderExpiry(){if(!linkExpiresAt)return;const seconds=Math.max(0,linkExpiresAt-Math.floor(Date.now()/1000));if(seconds<=0){$('expiry').textContent='授权链接已过期';$('expiry').className='expiry state error';stop();if(expiryTimer){clearInterval(expiryTimer);expiryTimer=null}setState('授权链接已过期，请让发起方重新生成','error');$('retry').classList.add('hidden');return}const minutes=Math.floor(seconds/60),rest=seconds%60;$('expiry').textContent=`授权链接剩余 ${minutes}分${String(rest).padStart(2,'0')}秒`;}
    function startExpiry(expiresAt){if(expiresAt)linkExpiresAt=Number(expiresAt);if(expiryTimer)clearInterval(expiryTimer);renderExpiry();expiryTimer=setInterval(renderExpiry,1000)}
    async function create(){if(busy)return;busy=true;stop();$('retry').classList.add('hidden');$('qr').textContent='正在生成二维码…';setState('请使用微信扫码');try{const data=await api('/qr',{method:'POST',body:'{}'});startExpiry(data.link_expires_at);sid=data.session_id;$('qr').innerHTML=`<img alt="仅限现场扫码，不要保存二维码" draggable="false" src="/account-link/${encodeURIComponent(token)}/qr/${encodeURIComponent(sid)}/image?t=${Date.now()}">`;timer=setInterval(poll,1500);await poll()}catch(error){$('qr').textContent='二维码生成失败';setState(error.message,'error');$('retry').classList.remove('hidden')}finally{busy=false}}
    async function poll(){if(!sid)return;try{const result=await api(`/qr/${encodeURIComponent(sid)}/poll`);if(result.status==='pending'){setState('等待扫码')}else if(result.status==='scanned'){setState('已扫码，请在手机上确认授权')}else if(result.status==='authorized'||result.status==='confirmed'){stop();setState('授权成功，正在保存账号');const account=await api(`/qr/${encodeURIComponent(sid)}/confirm`,{method:'POST',body:'{}'});$('qr').textContent='✓';setState(`授权完成：账号 ID ${account.id}`,'ok');$('intro').textContent='本次授权已完成，链接已经失效。'}else if(['expired','cancelled','unknown'].includes(result.status)){stop();setState('二维码已过期，授权链接仍有效，可重新生成','error');$('retry').classList.remove('hidden')}}catch(error){busy=false;stop();setState(error.message,'error');$('retry').classList.remove('hidden')}}
    $('retry').addEventListener('click',()=>{sid='';create()});create();
  </script>
</body>
</html>
