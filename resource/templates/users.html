<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>用户管理 - YYB Go</title>
  <link rel="stylesheet" href="/static/css/auth.css?v=20260921-ui">
  <link rel="stylesheet" href="/static/css/platform.css?v=20260921-ui">
  <style>
    .users-toolbar { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .users-toolbar .input { width:min(320px,100%); }
    .users-table { background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
    .users-table table { width:100%; border-collapse:collapse; }
    .users-table th,.users-table td { padding:12px 14px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
    .users-table th { background:var(--surface); color:var(--muted); font-size:12px; }
    .users-table tr:last-child td { border-bottom:0; }
    .user-identity strong,.user-identity small { display:block; }
    .user-identity small { margin-top:2px; color:var(--muted); }
    .user-actions-row { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
    .role-badge { display:inline-flex; padding:4px 8px; border-radius:999px; background:var(--surface); color:var(--muted); font-size:12px; }
    .role-badge.admin { background:#fbeef2; color:#9f2444; }
    .empty-users { padding:36px 16px; text-align:center; color:var(--muted); }
    .user-inspector { margin-top:16px; }
    .user-inspector-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; }
    .user-inspector-head h2 { margin:0; }
    .user-inspector-head p { margin:5px 0 0; color:var(--muted); }
    .inspected-accounts { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:10px; margin-top:16px; }
    .inspected-account { padding:13px; border:1px solid var(--line); border-radius:7px; background:var(--surface); }
    .inspected-account strong,.inspected-account small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .inspected-account small { margin-top:5px; color:var(--muted); }
    @media(max-width:720px){.users-toolbar{align-items:stretch;flex-direction:column}.users-toolbar .input{width:100%}.users-table{border:0;background:transparent}.users-table table,.users-table tbody,.users-table tr,.users-table td{display:block;width:100%}.users-table thead{display:none}.users-table tr{margin-bottom:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff}.users-table td{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border:0}.users-table td::before{content:attr(data-label);color:var(--muted);font-size:12px}.users-table td:first-child{display:block}.users-table td:first-child::before{display:none}}
  </style>
</head>
<body>
  <header class="shell-header"></header>
  <main class="page">
    <div class="page-title"><div><h1>用户管理</h1><p>管理控制台成员、角色和登录状态。</p></div></div>
    <section class="card" style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap">
        <div><h2 style="margin:0">注册策略</h2><p class="description" style="margin:5px 0 0">允许新用户从登录页自行注册，关闭后仅管理员可创建成员。</p></div>
        <label style="display:flex;align-items:center;gap:9px"><input id="registration" type="checkbox"> 开放注册</label>
      </div>
    </section>
    <div class="users-toolbar">
      <input class="input" id="searchUsers" type="search" placeholder="搜索用户名或显示名" aria-label="搜索用户">
      <button class="btn primary" id="showCreateUser" type="button">新增用户</button>
    </div>
    <section class="users-table" aria-label="用户列表">
      <table><thead><tr><th>用户</th><th>角色</th><th>状态</th><th>资源</th><th>积分</th><th>登录次数</th><th>最近登录</th><th>操作</th></tr></thead><tbody id="usersBody"></tbody></table>
      <div class="empty-users" id="usersEmpty" hidden>没有符合条件的用户。</div>
    </section>
    <section class="card user-inspector" id="userInspector" hidden>
      <div class="user-inspector-head"><div><h2 id="inspectTitle">用户账号</h2><p id="inspectSubtitle">只读查看该用户已绑定的 YYB 账号和当前状态。</p></div><button class="btn secondary" id="closeInspector" type="button">关闭查看</button></div>
      <div class="inspected-accounts" id="inspectedAccounts"></div>
    </section>
  </main>

  <dialog class="platform-dialog" id="createUserDialog">
    <form id="createUserForm" method="dialog">
      <div class="platform-dialog-head"><div><h2>新增用户</h2><p>创建可登录 YYB Go 控制台的成员。</p></div><button class="platform-dialog-close" type="button" data-close-dialog aria-label="关闭">×</button></div>
      <div class="platform-dialog-body">
        <div class="field"><label for="newUsername">用户名</label><input class="input" id="newUsername" autocomplete="off" minlength="3" maxlength="64" required></div>
        <div class="field"><label for="newDisplayName">显示名</label><input class="input" id="newDisplayName" maxlength="100" required></div>
        <div class="field"><label for="newPassword">初始密码</label><input class="input" id="newPassword" type="password" autocomplete="new-password" minlength="10" required><small class="description">至少 10 个字符。</small></div>
        <div class="field"><label for="newRole">角色</label><select class="input" id="newRole"><option value="user">普通用户</option><option value="admin">管理员</option></select></div>
        <div class="notice" id="createFeedback" hidden></div>
      </div>
      <div class="platform-dialog-actions"><button class="btn secondary" type="button" data-close-dialog>取消</button><button class="btn primary" id="createUserSubmit" type="submit">创建用户</button></div>
    </form>
  </dialog>

  <dialog class="platform-dialog" id="resetPasswordDialog">
    <form id="resetPasswordForm" method="dialog">
      <div class="platform-dialog-head"><div><h2>重置密码</h2><p id="resetPasswordCaption">设置新的登录密码。</p></div><button class="platform-dialog-close" type="button" data-close-dialog aria-label="关闭">×</button></div>
      <div class="platform-dialog-body">
        <div class="field"><label for="resetPassword">新密码</label><input class="input" id="resetPassword" type="password" autocomplete="new-password" minlength="10" required></div>
        <div class="field"><label for="resetPasswordConfirm">确认新密码</label><input class="input" id="resetPasswordConfirm" type="password" autocomplete="new-password" minlength="10" required></div>
        <div class="notice" id="resetFeedback" hidden></div>
      </div>
      <div class="platform-dialog-actions"><button class="btn secondary" type="button" data-close-dialog>取消</button><button class="btn primary" id="resetPasswordSubmit" type="submit">重置密码</button></div>
    </form>
  </dialog>
  <div class="toast" id="toast" hidden role="status"></div>

  <script>
    const $ = id => document.getElementById(id);
    const state = { users: [], resetUser: null };
    const escapeHTML = value => { const node = document.createElement("span"); node.textContent = value ?? ""; return node.innerHTML; };
    async function api(path, options = {}) {
      const response = await fetch(path, { headers: { "Content-Type": "application/json", ...(options.headers || {}) }, ...options });
      const text = await response.text();
      let payload;
      try { payload = text ? JSON.parse(text) : null; } catch { throw new Error(`服务返回了非 JSON 内容（HTTP ${response.status}）`); }
      if (!payload) throw new Error(`服务返回空响应（HTTP ${response.status}）`);
      if (!response.ok || payload.code !== 0) throw new Error(payload.msg || `请求失败（HTTP ${response.status}）`);
      return payload.data;
    }
    function toast(message, error = false) { const element = $("toast"); element.textContent = message; element.classList.toggle("error", error); element.hidden = false; clearTimeout(toast.timer); toast.timer = setTimeout(() => { element.hidden = true; }, 3200); }
    function feedback(id, message, error = true) { const element = $(id); element.hidden = false; element.className = `notice ${error ? "" : "ok"}`; element.textContent = message; }
    function formatTime(value) { return value ? new Date(value).toLocaleString("zh-CN", { hour12: false }) : "从未登录"; }
    function renderUsers() {
      const query = $("searchUsers").value.trim().toLowerCase();
      const users = state.users.filter(user => !query || user.username.toLowerCase().includes(query) || (user.display_name || "").toLowerCase().includes(query));
      $("usersBody").innerHTML = users.map(user => `<tr><td data-label="用户"><div class="user-identity"><strong>${escapeHTML(user.display_name || user.username)}</strong><small>${escapeHTML(user.username)} · ID ${user.id}</small></div></td><td data-label="角色"><span class="role-badge ${user.role}">${user.role === "admin" ? "管理员" : "普通用户"}</span></td><td data-label="状态">${user.enabled ? "已启用" : "已停用"}</td><td data-label="资源"><span class="resource-count">${user.account_count || 0} 个账号</span></td><td data-label="积分"><span class="points-unlimited">${escapeHTML(user.points?.label || "无限制")}</span></td><td data-label="登录次数">${user.login_count || 0}</td><td data-label="最近登录">${formatTime(user.last_login_at)}</td><td data-label="操作"><div class="user-actions-row"><button class="btn secondary" data-action="accounts" data-id="${user.id}">查看账号</button><button class="btn secondary" data-action="role" data-id="${user.id}" data-role="${user.role}" data-enabled="${user.enabled}">${user.role === "admin" ? "设为用户" : "设为管理员"}</button><button class="btn secondary" data-action="state" data-id="${user.id}" data-role="${user.role}" data-enabled="${user.enabled}">${user.enabled ? "停用" : "启用"}</button><button class="btn secondary" data-action="password" data-id="${user.id}">重置密码</button><button class="btn danger" data-action="delete" data-id="${user.id}">删除</button></div></td></tr>`).join("");
      $("usersEmpty").hidden = users.length > 0;
    }
    async function load() { const [users, registration] = await Promise.all([api("/api/auth/users"), api("/api/auth/registration")]); state.users = users; $("registration").checked = registration.enabled; renderUsers(); }
    async function updateUser(id, role, enabled) { try { await api(`/api/auth/users/${id}/state`, { method: "PUT", body: JSON.stringify({ role, enabled }) }); toast("用户状态已更新"); await load(); } catch (error) { toast(error.message, true); } }
    function openReset(user) { state.resetUser = user; $("resetPasswordForm").reset(); $("resetFeedback").hidden = true; $("resetPasswordCaption").textContent = `为 ${user.display_name || user.username} 设置新密码，保存后该用户现有会话将被注销。`; $("resetPasswordDialog").showModal(); $("resetPassword").focus(); }
    async function inspectAccounts(user) { $("userInspector").hidden = false; $("inspectTitle").textContent = `${user.display_name || user.username} 的账号`; $("inspectSubtitle").textContent = "正在读取该用户已绑定的 YYB 账号。"; $("inspectedAccounts").innerHTML = ""; try { const result = await api(`/api/auth/users/${user.id}/accounts`); const accounts = result.accounts || []; $("inspectSubtitle").textContent = `共 ${accounts.length} 个账号，只读查看，不会切换当前管理员会话。`; $("inspectedAccounts").innerHTML = accounts.map(account => { const name = account.remark || account.nickname || account.alias || account.openid || "未命名账号"; const status = account.status === "alive" ? "可用" : account.status === "expired" ? "需重扫" : "待确认"; return `<article class="inspected-account"><strong>${escapeHTML(name)}</strong><small>ID ${account.id} · ${escapeHTML(status)}</small><small>${escapeHTML(account.openid || "")}</small></article>`; }).join("") || '<div class="empty-users">该用户还没有绑定 YYB 账号。</div>'; } catch (error) { $("inspectSubtitle").textContent = `读取失败：${error.message}`; } }
    $("showCreateUser").onclick = () => { $("createUserForm").reset(); $("createFeedback").hidden = true; $("createUserDialog").showModal(); $("newUsername").focus(); };
    document.querySelectorAll("[data-close-dialog]").forEach(button => button.onclick = () => button.closest("dialog").close());
    $("createUserForm").onsubmit = async event => { event.preventDefault(); const button = $("createUserSubmit"); button.disabled = true; try { await api("/api/auth/users", { method: "POST", body: JSON.stringify({ username: $("newUsername").value.trim(), display_name: $("newDisplayName").value.trim(), password: $("newPassword").value, role: $("newRole").value }) }); $("createUserDialog").close(); toast("用户已创建"); await load(); } catch (error) { feedback("createFeedback", error.message); } finally { button.disabled = false; } };
    $("resetPasswordForm").onsubmit = async event => { event.preventDefault(); if ($("resetPassword").value !== $("resetPasswordConfirm").value) { feedback("resetFeedback", "两次输入的密码不一致"); return; } const button = $("resetPasswordSubmit"); button.disabled = true; try { await api(`/api/auth/users/${state.resetUser.id}/password`, { method: "PUT", body: JSON.stringify({ password: $("resetPassword").value }) }); $("resetPasswordDialog").close(); toast("密码已重置，该用户会话已注销"); } catch (error) { feedback("resetFeedback", error.message); } finally { button.disabled = false; } };
    $("usersBody").onclick = async event => { const button = event.target.closest("button[data-action]"); if (!button) return; const user = state.users.find(item => String(item.id) === button.dataset.id); if (!user) return; if (button.dataset.action === "accounts") await inspectAccounts(user); if (button.dataset.action === "role") await updateUser(user.id, user.role === "admin" ? "user" : "admin", user.enabled); if (button.dataset.action === "state") await updateUser(user.id, user.role, !user.enabled); if (button.dataset.action === "password") openReset(user); if (button.dataset.action === "delete" && confirm(`确定删除用户“${user.display_name || user.username}”吗？此操作无法撤销。`)) { try { await api(`/api/auth/users/${user.id}/delete`, { method: "DELETE" }); toast("用户已删除"); await load(); } catch (error) { toast(error.message, true); } } };
    $("closeInspector").onclick = () => { $("userInspector").hidden = true; };
    $("registration").onchange = async event => { try { await api("/api/auth/registration", { method: "PUT", body: JSON.stringify({ enabled: event.target.checked }) }); toast(event.target.checked ? "已开放用户注册" : "已关闭用户注册"); } catch (error) { event.target.checked = !event.target.checked; toast(error.message, true); } };
    $("searchUsers").oninput = renderUsers;
    load().catch(error => toast(error.message, true));
  </script>
  <script src="/static/js/platform.js?v=20260921-ui"></script>
</body>
</html>
