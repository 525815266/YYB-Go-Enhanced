<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>个人设置 - YYB Go</title>
  <link rel="stylesheet" href="/static/css/auth.css?v=20260921-ui">
  <link rel="stylesheet" href="/static/css/platform.css?v=20260921-ui">
</head>
<body>
  <header class="shell-header"></header>
  <main class="page">
    <div class="page-title"><div><h1>个人设置</h1><p>维护个人资料、登录密码和设备会话。</p></div></div>
    <div class="grid">
      <section class="card"><h2>基本信息</h2><p class="description">用户名用于登录，不支持自行修改。</p><form id="profileForm"><div class="field"><label for="username">用户名</label><input class="input" id="username" disabled></div><div class="field"><label for="displayName">显示名</label><input class="input" id="displayName" maxlength="100" required></div><div class="notice" id="profileNotice" hidden></div><button class="btn primary" type="submit">保存信息</button></form></section>
      <section class="card"><h2>修改密码</h2><p class="description">修改后会自动注销其他设备上的会话。</p><form id="passwordForm"><div class="field"><label for="currentPassword">当前密码</label><input class="input" id="currentPassword" type="password" autocomplete="current-password" required></div><div class="field"><label for="newPassword">新密码</label><input class="input" id="newPassword" type="password" autocomplete="new-password" minlength="10" required></div><div class="notice" id="passwordNotice" hidden></div><button class="btn primary" type="submit">更新密码</button></form></section>
      <section class="card" style="grid-column:1/-1"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap"><div><h2>登录会话</h2><p class="description">查看仍有效的设备，或注销除当前设备以外的会话。</p></div><button class="btn danger" id="clearSessions" type="button">注销其他会话</button></div><div class="session-list" id="sessions"></div></section>
    </div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    async function api(path, options = {}) { const response = await fetch(path, { headers: { "Content-Type": "application/json", ...(options.headers || {}) }, ...options }); const text = await response.text(); let payload; try { payload = text ? JSON.parse(text) : null; } catch { throw new Error(`服务返回了非 JSON 内容（HTTP ${response.status}）`); } if (!payload) throw new Error(`服务返回空响应（HTTP ${response.status}）`); if (!response.ok || payload.code !== 0) throw new Error(payload.msg || "请求失败"); return payload.data; }
    function notice(id, text, ok = true) { const element = $(id); element.hidden = false; element.className = `notice ${ok ? "ok" : ""}`; element.textContent = text; }
    function escapeHTML(value) { const element = document.createElement("span"); element.textContent = value ?? ""; return element.innerHTML; }
    async function load() { const me = (await api("/api/auth/me")).user; $("username").value = me.username; $("displayName").value = me.display_name; const sessionData = await api("/api/auth/sessions"); $("sessions").innerHTML = sessionData.sessions.map(session => `<div class="session"><div><strong>${session.id === sessionData.current_session_id ? "当前会话" : "其他会话"}</strong><small>${escapeHTML(session.ip_address || "-")} · ${escapeHTML(session.user_agent || "未知设备")}</small></div><small>${new Date(session.last_seen_at).toLocaleString("zh-CN", { hour12: false })}</small></div>`).join("") || '<div class="notice">没有有效会话</div>'; }
    $("profileForm").onsubmit = async event => { event.preventDefault(); try { await api("/api/auth/profile", { method: "PUT", body: JSON.stringify({ display_name: $("displayName").value.trim() }) }); notice("profileNotice", "基本信息已保存"); } catch (error) { notice("profileNotice", error.message, false); } };
    $("passwordForm").onsubmit = async event => { event.preventDefault(); try { await api("/api/auth/password", { method: "PUT", body: JSON.stringify({ current_password: $("currentPassword").value, new_password: $("newPassword").value }) }); event.target.reset(); notice("passwordNotice", "密码已更新，其他会话已注销"); } catch (error) { notice("passwordNotice", error.message, false); } };
    $("clearSessions").onclick = async () => { try { await api("/api/auth/sessions", { method: "DELETE" }); await load(); } catch (error) { alert(error.message); } };
    load().catch(() => { location.href = "/login"; });
  </script>
  <script src="/static/js/platform.js?v=20260921-ui"></script>
</body>
</html>
