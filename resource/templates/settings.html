<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>个人设置 - YYB Go</title>
  <link rel="stylesheet" href="/static/css/auth.css?v=20260921-ui">
  <link rel="stylesheet" href="/static/css/platform.css?v=20261103-skin">
  <link rel="stylesheet" href="/static/css/skin-clean.css?v=20261103-skin">
  <script>try{if(localStorage.getItem("yyb-skin")==="clean")document.documentElement.dataset.skin="clean"}catch(e){}</script>
</head>
<body>
  <header class="shell-header"></header>
  <main class="page">
    <div class="page-title"><div><h1>个人设置</h1><p>维护个人资料、登录密码和设备会话。</p></div></div>
    <div class="grid">
	  <section class="card"><h2>扫码渠道</h2><p class="description">个人设置优先。更新账号时也可切换，确认后替换原 ID 的授权。</p><form id="scanForm"><div class="field" id="personalScanField"><label for="personalScan">个人默认</label><select class="input" id="personalScan"><option value="">跟随系统</option><option value="appstore">YYB</option><option value="pcmgr">PCMgr</option><option value="gameassist">GameAssist</option></select></div><div id="globalScanField" hidden><div class="field"><label for="globalScan">系统默认</label><select class="input" id="globalScan"><option value="appstore">YYB</option><option value="pcmgr">PCMgr</option><option value="gameassist">GameAssist</option></select></div></div><div class="notice" id="scanNotice" hidden></div><button class="btn primary" type="submit" id="saveScan">保存扫码设置</button></form></section>
      <section class="card" id="runtimeCard" hidden><h2>运行参数</h2><p class="description">取码限速、登录预算与动态黑名单，保存后 1 秒内生效并保留到重启之后。其余 env 配置见 docs/configuration.md。</p><form id="runtimeForm">
        <div class="field"><label for="rtMinGap">取码最小间隔（秒/账号）</label><input class="input" id="rtMinGap" type="number" min="0" step="1"></div>
        <div class="field"><label for="rtMaxWait">最大排队等待（秒）</label><input class="input" id="rtMaxWait" type="number" min="0" step="1"></div>
        <div class="field"><label for="rtBudget">登录预算（次，0 关闭重建）</label><input class="input" id="rtBudget" type="number" min="0" max="1000" step="1"></div>
        <div class="field"><label for="rtWindow">登录窗口（分钟）</label><input class="input" id="rtWindow" type="number" min="1" step="1"></div>
        <div class="field"><label for="rtFresh">新鲜会话保护窗口（分钟，0 关闭）</label><input class="input" id="rtFresh" type="number" min="0" step="1"></div>
        <div class="field"><label for="rtDenyThreshold">动态黑名单阈值（几个不同账号失败才禁用）</label><input class="input" id="rtDenyThreshold" type="number" min="1" max="50" step="1"></div>
        <div class="field"><label><input type="checkbox" id="rtDenyEnabled"> 启用动态自学习黑名单</label></div>
        <div class="notice" id="runtimeNotice" hidden></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="submit" id="saveRuntime">保存运行参数</button><button class="btn" type="button" id="resetRuntime">恢复 env 默认</button></div>
      </form></section>
      <section class="card"><h2>基本信息</h2><p class="description">用户名用于登录，不支持自行修改。</p><form id="profileForm"><div class="field"><label for="username">用户名</label><input class="input" id="username" disabled></div><div class="field"><label for="displayName">显示名</label><input class="input" id="displayName" maxlength="100" required></div><div class="notice" id="profileNotice" hidden></div><button class="btn primary" type="submit">保存信息</button></form></section>
      <section class="card"><h2>修改密码</h2><p class="description">修改后会自动注销其他设备上的会话。</p><form id="passwordForm"><div class="field"><label for="currentPassword">当前密码</label><input class="input" id="currentPassword" type="password" autocomplete="current-password" required></div><div class="field"><label for="newPassword">新密码</label><input class="input" id="newPassword" type="password" autocomplete="new-password" minlength="10" required></div><div class="notice" id="passwordNotice" hidden></div><button class="btn primary" type="submit">更新密码</button></form></section>
      <section class="card" style="grid-column:1/-1"><div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap"><div><h2>登录会话</h2><p class="description">查看仍有效的设备，或注销除当前设备以外的会话。</p></div><button class="btn danger" id="clearSessions" type="button">注销其他会话</button></div><div class="session-list" id="sessions"></div></section>
    </div>
  </main>
  <script src="/static/js/scan-channel.js?v=050"></script>
  <script>
    const $ = id => document.getElementById(id);
    async function api(path, options = {}) { const response = await fetch(path, { headers: { "Content-Type": "application/json", ...(options.headers || {}) }, ...options }); const text = await response.text(); let payload; try { payload = text ? JSON.parse(text) : null; } catch { throw new Error(`服务返回了非 JSON 内容（HTTP ${response.status}）`); } if (!payload) throw new Error(`服务返回空响应（HTTP ${response.status}）`); if (!response.ok || payload.code !== 0) throw new Error(payload.msg || "请求失败"); return payload.data; }
    function notice(id, text, ok = true) { const element = $(id); element.hidden = false; element.className = `notice ${ok ? "ok" : ""}`; element.textContent = text; }
    function escapeHTML(value) { const element = document.createElement("span"); element.textContent = value ?? ""; return element.innerHTML; }
	let scanSettings;
	function fillScanOptions(){for(const [id,leading] of [['personalScan',[['','跟随系统']]],['globalScan',[]]]){const select=$(id),current=select.value;select.replaceChildren(...leading.concat(scanChannels().map(channel=>[channel.id,channel.name])).map(([value,label])=>{const option=document.createElement('option');option.value=value;option.textContent=label;return option;}));if([...select.options].some(option=>option.value===current))select.value=current;}}
	async function loadScanSettings(){ scanSettings=await api('/api/scan-settings');$('personalScan').value=scanSettings.personal;$('globalScan').value=scanSettings.global;$('personalScanField').hidden=!scanSettings.has_personal_account;$('globalScanField').hidden=!scanSettings.can_manage_global; }
	$('scanForm').onsubmit=async event=>{event.preventDefault();$('saveScan').disabled=true;try{if(scanSettings.can_manage_global)await api('/api/scan-settings',{method:'PUT',body:JSON.stringify({scope:'global',product:$('globalScan').value})});if(scanSettings.has_personal_account)await api('/api/scan-settings',{method:'PUT',body:JSON.stringify({scope:'personal',product:$('personalScan').value})});await loadScanSettings();notice('scanNotice','默认扫码渠道已保存');}catch(error){notice('scanNotice',error.message,false);}finally{$('saveScan').disabled=false;}};
	loadScanChannels().then(fillScanOptions).then(loadScanSettings).catch(error=>notice('scanNotice',error.message,false));
    async function load() { const data = await api("/api/auth/me"); if(data.auth_enabled === false){ ['profileForm','passwordForm','sessions'].forEach(id=>$(id).closest('.card').hidden=true);document.querySelector('h1').textContent='扫码设置';document.querySelector('.page-title p').textContent='设置本机默认扫码渠道。';return; } const me=data.user; $("username").value = me.username; $("displayName").value = me.display_name; const sessionData = await api("/api/auth/sessions"); $("sessions").innerHTML = sessionData.sessions.map(session => `<div class="session"><div><strong>${session.id === sessionData.current_session_id ? "当前会话" : "其他会话"}</strong><small>${escapeHTML(session.ip_address || "-")} · ${escapeHTML(session.user_agent || "未知设备")}</small></div><small>${new Date(session.last_seen_at).toLocaleString("zh-CN", { hour12: false })}</small></div>`).join("") || '<div class="notice">没有有效会话</div>'; }
    $("profileForm").onsubmit = async event => { event.preventDefault(); try { await api("/api/auth/profile", { method: "PUT", body: JSON.stringify({ display_name: $("displayName").value.trim() }) }); notice("profileNotice", "基本信息已保存"); } catch (error) { notice("profileNotice", error.message, false); } };
    $("passwordForm").onsubmit = async event => { event.preventDefault(); try { await api("/api/auth/password", { method: "PUT", body: JSON.stringify({ current_password: $("currentPassword").value, new_password: $("newPassword").value }) }); event.target.reset(); notice("passwordNotice", "密码已更新，其他会话已注销"); } catch (error) { notice("passwordNotice", error.message, false); } };
    $("clearSessions").onclick = async () => { try { await api("/api/auth/sessions", { method: "DELETE" }); await load(); } catch (error) { alert(error.message); } };
    let runtimeLoaded = false;
    async function loadRuntime(){ const data = await api('/api/runtime-settings'); $('runtimeCard').hidden = false; const e = data.effective; $('rtMinGap').value = Math.round(e.code_min_gap_ms/1000); $('rtMaxWait').value = Math.round(e.code_max_wait_ms/1000); $('rtBudget').value = e.login_budget; $('rtWindow').value = Math.max(1, Math.round(e.login_window_ms/60000)); $('rtFresh').value = Math.round(e.fresh_session_window_ms/60000); $('rtDenyThreshold').value = data.dynamic_deny.threshold; $('rtDenyEnabled').checked = data.dynamic_deny.enabled; runtimeLoaded = true; }
    $('runtimeForm').onsubmit = async event => { event.preventDefault(); $('saveRuntime').disabled = true; try { await api('/api/runtime-settings', { method: 'PUT', body: JSON.stringify({ code_min_gap_ms: Number($('rtMinGap').value)*1000, code_max_wait_ms: Number($('rtMaxWait').value)*1000, login_budget: Number($('rtBudget').value), login_window_ms: Math.max(1, Number($('rtWindow').value))*60000, fresh_session_window_ms: Number($('rtFresh').value)*60000, dynamic_deny_threshold: Number($('rtDenyThreshold').value), dynamic_deny_enabled: $('rtDenyEnabled').checked }) }); await loadRuntime(); notice('runtimeNotice', '运行参数已保存，1 秒内生效'); } catch (error) { notice('runtimeNotice', error.message, false); } finally { $('saveRuntime').disabled = false; } };
    $('resetRuntime').onclick = async () => { try { await api('/api/runtime-settings', { method: 'PUT', body: JSON.stringify({ reset: true }) }); await loadRuntime(); notice('runtimeNotice', '已恢复 env 默认取码参数'); } catch (error) { notice('runtimeNotice', error.message, false); } };
    loadRuntime().catch(() => { $('runtimeCard').hidden = true; });
    load().catch(() => { location.href = "/login"; });
  </script>
  <script src="/static/js/platform.js?v=20261103-skin"></script>
</body>
</html>
