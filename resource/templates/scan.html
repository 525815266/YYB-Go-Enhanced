<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>添加账号 - YYB Go</title>
  <link rel="stylesheet" href="/static/css/platform.css?v=20260824-push1">
  <style>
    :root { color-scheme: light; --bg:#f5f6f8; --surface:#fff; --ink:#20242b; --muted:#68707d; --line:#dde1e7; --primary:#c53255; --primary-hover:#a82445; --success:#287a49; --success-soft:#edf8f1; --danger:#b53636; --radius:8px; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
    button,input,select { font:inherit; } button { cursor:pointer; }
    .topbar { min-height:64px; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 24px; background:var(--surface); border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:11px; min-width:0; }
    .mark { width:36px; height:36px; border-radius:var(--radius); display:grid; place-items:center; background:var(--ink); color:#fff; font-weight:800; }
    .brand h1 { margin:0; font-size:18px; line-height:1.2; letter-spacing:0; }
    .brand p { margin:2px 0 0; color:var(--muted); font-size:12px; }
    .link { color:var(--ink); text-decoration:none; border:1px solid var(--line); border-radius:var(--radius); padding:8px 12px; background:#fff; }
    main { width:min(920px,calc(100% - 32px)); margin:32px auto; display:grid; grid-template-columns:minmax(300px,380px) minmax(0,1fr); gap:20px; align-items:start; }
    .panel { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
    .head { padding:18px 20px; border-bottom:1px solid var(--line); }
    .head h2 { margin:0; font-size:17px; letter-spacing:0; }
    .head p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .body { padding:20px; }
    .mode-switch { display:grid; grid-template-columns:1fr 1fr; gap:4px; margin-bottom:18px; padding:4px; background:#eef0f3; border-radius:var(--radius); }
    .mode-button { min-height:36px; border:0; border-radius:6px; background:transparent; color:var(--muted); font-weight:650; }
    .mode-button[aria-selected="true"] { background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(25,31,40,.12); }
    .mode-pane[hidden] { display:none; }
    .qr { width:min(100%,280px); aspect-ratio:1; margin:0 auto; display:grid; place-items:center; background:#fafafa; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; color:var(--muted); }
    .qr { position:relative; }
    .qr img { width:100%; height:100%; object-fit:contain; transition:filter 180ms ease, opacity 180ms ease; }
    .qr.waiting-confirm img { filter:blur(7px); opacity:.35; }
    .qr.waiting-confirm::after { content:attr(data-waiting-label); position:absolute; inset:0; display:grid; place-items:center; padding:20px; text-align:center; color:#20242b; font-weight:750; font-size:16px; background:rgba(255,255,255,.46); backdrop-filter:blur(1px); }
    .quick-state { min-height:280px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; text-align:center; padding:24px; background:#fafafa; border:1px solid var(--line); border-radius:var(--radius); }
    .quick-avatar { width:72px; height:72px; border-radius:50%; display:grid; place-items:center; object-fit:cover; background:#e8eaee; color:var(--muted); font-size:22px; font-weight:750; }
    .quick-state strong { font-size:16px; }
    .quick-state span { max-width:260px; color:var(--muted); font-size:13px; }
    .check { font-size:54px; color:var(--success); }
    .status { min-height:24px; margin:16px 0 0; text-align:center; font-weight:600; }
    .status.pending { color:var(--muted); } .status.scanned { color:#2166a5; } .status.ok { color:var(--success); } .status.error { color:var(--danger); }
    .countdown { min-height:18px; margin-top:2px; text-align:center; color:var(--muted); font-size:12px; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:18px; }
    .btn { min-height:38px; border:1px solid var(--line); border-radius:var(--radius); padding:8px 13px; display:inline-flex; align-items:center; justify-content:center; gap:7px; background:#fff; color:var(--ink); }
    .btn:hover { background:#f5f6f8; } .btn.primary { background:var(--primary); border-color:var(--primary); color:#fff; } .btn.primary:hover { background:var(--primary-hover); } .btn:disabled { cursor:wait; opacity:.6; }
    .account { display:none; }
    .account.visible { display:block; }
    .identity { padding:14px; background:var(--success-soft); border:1px solid #cde7d6; border-radius:var(--radius); }
    .identity strong { display:block; color:var(--success); font-size:16px; margin-bottom:8px; }
    .row { display:grid; grid-template-columns:64px minmax(0,1fr); gap:10px; padding:5px 0; }
    .row span { color:var(--muted); } code { overflow-wrap:anywhere; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
    .field { margin-top:18px; } .field label { display:block; margin-bottom:6px; font-weight:650; }
    .field small { display:block; margin-top:5px; color:var(--muted); }
    .input { width:100%; min-height:40px; border:1px solid var(--line); border-radius:var(--radius); padding:8px 10px; color:var(--ink); background:#fff; }
    .input:focus { outline:2px solid color-mix(in srgb,var(--primary) 24%,transparent); border-color:var(--primary); }
    .message { min-height:20px; margin-top:12px; color:var(--muted); font-size:13px; }
    .message.ok { color:var(--success); } .message.error { color:var(--danger); }
    .placeholder { color:var(--muted); padding:6px 0; }
    .proxy-options { margin-bottom:18px; padding:12px; border:1px solid var(--line); border-radius:var(--radius); background:#fafafa; }
    .proxy-options summary { cursor:pointer; font-weight:700; }
    .proxy-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:12px; }
    .proxy-grid>* { min-width:0; }
    .proxy-wide { grid-column:1 / -1; }
    .proxy-message { min-height:18px; margin-top:8px; color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
    .location-suggestion { margin-top:10px; padding:10px; display:flex; align-items:center; justify-content:space-between; gap:10px; border:1px solid #c9d9e8; border-radius:var(--radius); background:#f1f7fc; color:#254b6d; }
    .location-suggestion[hidden] { display:none; }
    .location-suggestion strong { display:block; font-size:13px; }
    .location-suggestion span { display:block; margin-top:2px; font-size:12px; }
    .location-actions { display:flex; gap:6px; flex:0 0 auto; }
    @media (max-width:720px) { .topbar { padding:10px 16px; } .brand p { display:none; } main { margin:16px auto; grid-template-columns:1fr; } .actions .btn { flex:1 1 140px; } .proxy-grid { grid-template-columns:1fr; } .proxy-wide { grid-column:auto; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition:none!important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="mark">Y</div><div><h1>添加微信账号</h1><p>授权成功后可直接同步到青龙</p></div></div>
    <a class="link" href="/">返回控制台</a>
  </header>
  <main>
    <section class="panel">
      <div class="head"><h2>微信授权</h2><p>选择本机微信确认或手机扫码</p></div>
      <div class="body">
        <details class="proxy-options" id="scanProxyOptions">
          <summary>登录网络代理</summary>
          <div class="proxy-grid">
            <div class="field">
              <label for="scanProxyMode">连接模式</label>
              <select class="input" id="scanProxyMode">
                <option value="direct">直连</option>
                <option value="static">静态代理</option>
                <option value="api">动态代理 API</option>
				<option value="profile">供应商配置</option>
              </select>
            </div>
            <div class="field">
              <label for="scanProxyType">代理协议</label>
              <select class="input" id="scanProxyType">
                <option value="http">HTTP CONNECT</option>
                <option value="socks5">SOCKS5</option>
              </select>
            </div>
            <div class="field proxy-wide" id="scanStaticProxyGroup" hidden>
              <label for="scanStaticProxy">代理地址</label>
              <input class="input" id="scanStaticProxy" placeholder="user:pass@127.0.0.1:8080" autocomplete="off" spellcheck="false">
            </div>
            <div class="field proxy-wide" id="scanProxyAPIGroup" hidden>
              <label for="scanProxyAPI">代理提取 API</label>
              <input class="input" id="scanProxyAPI" placeholder="https://example.com/get?province=山东&city=济南" autocomplete="off" spellcheck="false">
            </div>
			<div class="field proxy-wide" id="scanProxyProfileGroup" hidden>
			  <label for="scanProxyProfile">供应商配置</label>
			  <select class="input" id="scanProxyProfile"></select>
			</div>
			<div class="field" id="scanProvinceGroup" hidden>
			  <label for="scanProvince">省份</label>
			  <select class="input" id="scanProvince"><option value="all">全国</option></select>
			</div>
			<div class="field" id="scanCityGroup" hidden>
			  <label for="scanCity">城市</label>
			  <select class="input" id="scanCity"><option value="">全国</option></select>
			</div>
          </div>
          <div class="actions">
            <button class="btn" id="scanLocationBtn" type="button">推荐代理地区</button>
            <button class="btn" id="scanProxyTestBtn" type="button">测试代理</button>
            <button class="btn" id="scanProxyApplyBtn" type="button">应用到授权</button>
          </div>
          <div class="location-suggestion" id="scanLocationSuggestion" hidden>
            <div><strong id="scanLocationTitle">地区推荐</strong><span id="scanLocationDetail"></span></div>
            <div class="location-actions">
              <button class="btn primary" id="scanLocationUseBtn" type="button">采用此地区</button>
              <button class="btn" id="scanLocationDismissBtn" type="button">忽略</button>
            </div>
          </div>
          <div class="proxy-message" id="scanProxyMessage">默认直连</div>
        </details>
        <div class="mode-switch" role="tablist" aria-label="授权方式">
          <button class="mode-button" id="quickModeBtn" type="button" role="tab" aria-selected="false" aria-controls="quickPane">本机微信</button>
          <button class="mode-button" id="qrModeBtn" type="button" role="tab" aria-selected="true" aria-controls="qrPane">扫码</button>
        </div>
        <div class="mode-pane" id="quickPane" role="tabpanel" aria-labelledby="quickModeBtn" hidden>
          <div class="quick-state" id="quickState" role="status" aria-live="polite">
            <div class="quick-avatar" id="quickAvatar">微</div>
            <strong id="quickName">正在检测本机微信</strong>
            <span id="quickDetail">请保持电脑微信已登录且未锁定</span>
          </div>
          <div class="actions">
            <button class="btn primary" id="quickAuthBtn" type="button" disabled>使用本机微信授权</button>
            <button class="btn" id="quickRetryBtn" type="button">重新检测</button>
          </div>
        </div>
        <div class="mode-pane" id="qrPane" role="tabpanel" aria-labelledby="qrModeBtn">
          <div class="qr" id="qrWrap">准备生成二维码</div>
          <div class="status pending" id="status">等待生成二维码</div>
          <div class="countdown" id="countdown"></div>
          <div class="actions">
            <button class="btn" id="refreshBtn" type="button">重新生成</button>
          </div>
        </div>
        <div class="actions"><button class="btn" id="backBtn" type="button">账号列表</button></div>
      </div>
    </section>
    <section class="panel">
      <div class="head"><h2>账号信息</h2><p>备注用于账号运行管理和青龙任务名称</p></div>
      <div class="body">
        <div class="placeholder" id="accountPlaceholder">授权成功后将在这里显示账号信息。</div>
        <div class="account" id="accountBox">
          <div class="identity">
            <strong id="accountName">-</strong>
            <div class="row"><span>ID</span><code id="accountId">-</code></div>
            <div class="row"><span>OpenID</span><code id="accountOpenid">-</code></div>
            <div class="row"><span>状态</span><code id="accountStatus">-</code></div>
          </div>
          <div class="field">
            <label for="remarkInput">账号备注</label>
            <input class="input" id="remarkInput" maxlength="80" placeholder="例如：Boom、微信账号 2" autocomplete="off">
            <small>运行管理中显示为“账号 ID · 备注”，脚本仍按账号 ID 运行。</small>
          </div>
          <div class="actions">
            <button class="btn" id="saveRemarkBtn" type="button">保存备注</button>
            <button class="btn primary" id="syncBtn" type="button">添加到面板</button>
            <button class="btn" id="copyBtn" type="button">复制 OpenID</button>
          </div>
          <div class="message" id="actionMessage" role="status"></div>
        </div>
      </div>
    </section>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const QR_TTL = 110;
    const PC_LOGIN_ENABLED = __YYB_PC_LOGIN_ENABLED__;
    let sid = null, account = null, pollTimer = null, countdownTimer = null, seconds = 0;
    let quickConfig = null, quickPort = null, quickProfile = null, quickBusy = false;
	let proxyProfiles = [], proxyCities = new Map(), pendingLocation = null;
    async function api(method,url,body) { const options={method,headers:{"Content-Type":"application/json"}}; if(body!==undefined) options.body=JSON.stringify(body); const response=await fetch(url,options); const text=await response.text(); let payload=null; try{payload=text?JSON.parse(text):null}catch{payload=text} const envelope=payload&&typeof payload==="object"&&!Array.isArray(payload)&&"code" in payload&&"data" in payload; if(!response.ok||(envelope&&payload.code!==0)) throw new Error(envelope?payload.msg:`HTTP ${response.status}`); return envelope?payload.data:payload; }
    function stopTimers(){ if(pollTimer) clearInterval(pollTimer); if(countdownTimer) clearInterval(countdownTimer); pollTimer=countdownTimer=null; }
	function proxyPayload(){ const mode=$('scanProxyMode').value,profileMode=mode==="profile",province=$('scanProvince'),city=$('scanCity').value; return {product:"appstore",mode:profileMode?"api":mode,proxy_type:$('scanProxyType').value,static_proxy:$('scanStaticProxy').value.trim(),api_url:$('scanProxyAPI').value.trim(),provider_profile_id:profileMode&&$('scanProxyProfile').value?Number($('scanProxyProfile').value):null,region_code:profileMode?(city||province.value):"",region_province:profileMode&&province.value!=="all"?province.options[province.selectedIndex]?.text||"":"",region_city:profileMode&&city?$('scanCity').options[$('scanCity').selectedIndex]?.text||"":"",refresh_ahead_minutes:5}; }
	function proxyChoiceLabel(){const mode=$('scanProxyMode').value;if(mode==="direct")return "直连";if(mode==="static")return "静态代理";if(mode==="api")return "自定义动态 API";const profile=$('scanProxyProfile').options[$('scanProxyProfile').selectedIndex]?.text||"供应商配置",region=$('scanCity').value?$('scanCity').options[$('scanCity').selectedIndex]?.text:$('scanProvince').options[$('scanProvince').selectedIndex]?.text||"全国";return `${profile} · ${region}`;}
	function showProxyChoice(){ $('scanProxyMessage').textContent=`新账号将使用：${proxyChoiceLabel()}。已有账号重扫时保留原代理。`; }
	function toggleProxyFields(){ const mode=$('scanProxyMode').value; $('scanStaticProxyGroup').hidden=mode!=="static"; $('scanProxyAPIGroup').hidden=mode!=="api"; $('scanProxyProfileGroup').hidden=mode!=="profile"; $('scanProvinceGroup').hidden=mode!=="profile"; $('scanCityGroup').hidden=mode!=="profile"; $('scanProxyType').disabled=mode==="direct"||mode==="profile";showProxyChoice(); }
	async function loadScanCities(province){ if(!province||province==="all"){$('scanCity').innerHTML='<option value="">全国</option>';showProxyChoice();return;} let cities=proxyCities.get(province);if(!cities){cities=await api("GET",`/api/proxy-profiles/areas/cities?province=${encodeURIComponent(province)}`);proxyCities.set(province,cities)}$('scanCity').innerHTML='<option value="">全省</option>'+cities.map(area=>`<option value="${area.code}">${area.name}</option>`).join('');showProxyChoice(); }
	async function initializeProxyOptions(){ try{const [profiles,provinces]=await Promise.all([api("GET","/api/proxy-profiles"),api("GET","/api/proxy-profiles/areas/provinces")]);proxyProfiles=profiles;$('scanProxyProfile').innerHTML=profiles.map(profile=>`<option value="${profile.id}">${profile.name} · ${profile.provider==="juliang"?"巨量":"品赞"}</option>`).join('')||'<option value="">请先在代理设置中添加配置</option>';$('scanProvince').innerHTML=provinces.map(area=>`<option value="${area.code}">${area.name}</option>`).join('');}catch(error){$('scanProxyMessage').textContent=`供应商配置读取失败：${error.message}`;} }
	function locationSourceLabel(source){return source==="browser_geolocation"?"手机定位":source==="client_public_ip"?"当前设备公网 IP":"飞牛公网出口";}
	function hideLocationSuggestion(){pendingLocation=null;$('scanLocationSuggestion').hidden=true;}
	async function requestBrowserLocation(){return new Promise((resolve,reject)=>navigator.geolocation.getCurrentPosition(position=>resolve({latitude:position.coords.latitude,longitude:position.coords.longitude}),reject,{enableHighAccuracy:true,timeout:8000,maximumAge:300000}));}
	async function recommendLocation(){const button=$('scanLocationBtn');button.disabled=true;$('scanProxyMessage').textContent="正在定位并匹配代理地区";try{let coordinates={};if(window.isSecureContext&&navigator.geolocation){try{coordinates=await requestBrowserLocation();}catch{coordinates={};}}pendingLocation=await api("POST","/api/proxy-location/recommend",coordinates);const place=[pendingLocation.province,pendingLocation.city].filter(Boolean).join(" · ");$('scanLocationTitle').textContent=`推荐：${place}`;$('scanLocationDetail').textContent=`来源：${locationSourceLabel(pendingLocation.source)}。采用后仍需点击“应用到授权”。`;$('scanLocationSuggestion').hidden=false;$('scanProxyMessage').textContent="推荐结果尚未应用，当前代理配置保持不变";}catch(error){hideLocationSuggestion();$('scanProxyMessage').textContent=`地区推荐失败：${error.message}`;}finally{button.disabled=false;}}
	async function useRecommendedLocation(){if(!pendingLocation)return;if(!proxyProfiles.length){$('scanProxyMessage').textContent="请先在代理设置中添加品赞或巨量配置";return;}$('scanProxyMode').value="profile";toggleProxyFields();$('scanProvince').value=pendingLocation.province_code;if($('scanProvince').value!==pendingLocation.province_code){$('scanProxyMessage').textContent=`省份 ${pendingLocation.province} 不在当前代理地区列表中`;return;}await loadScanCities(pendingLocation.province_code);$('scanCity').value=pendingLocation.city_code||"";const place=[pendingLocation.province,pendingLocation.city].filter(Boolean).join(" · ");hideLocationSuggestion();$('scanProxyMessage').textContent=`已预填 ${place}，点击“应用到授权”后生效`;}
	function normalizeLocationName(value){return String(value||"").replace(/壮族自治区|回族自治区|维吾尔自治区|特别行政区|自治区|省|市/g,"").trim().toLowerCase();}
    async function testProxy(){ const button=$('scanProxyTestBtn'); button.disabled=true; $('scanProxyMessage').textContent="正在提取并校验代理"; try{const payload=proxyPayload(),result=await api("POST","/accounts/proxy/test",payload);if(!result.resolved){$('scanProxyMessage').textContent="直连模式无需代理";return;}const exit=[result.exit_region,result.exit_city].filter(Boolean).join(" · ");const requested=[payload.region_province,payload.region_city].filter(Boolean).join(" · ");const cityMatches=!payload.region_city||normalizeLocationName(result.exit_city)===normalizeLocationName(payload.region_city);const regionMatches=!payload.region_province||normalizeLocationName(result.exit_region)===normalizeLocationName(payload.region_province);$('scanProxyMessage').textContent=exit?`代理解析成功：${result.proxy}；实际出口：${exit}${requested&&(!cityMatches||!regionMatches)?`，与目标 ${requested} 不一致，请勿直接应用`:""}`:`代理解析成功：${result.proxy}${result.probe_error?`；${result.probe_error}`:""}`;}catch(error){$('scanProxyMessage').textContent=`代理测试失败：${error.message}`;}finally{button.disabled=false;} }
    function applyProxy(){ stopTimers(); sid=null; quickConfig=null; quickPort=null; quickProfile=null; $('scanProxyMessage').textContent="代理配置已应用到新的授权会话"; const quick=$('quickModeBtn').getAttribute('aria-selected')==='true'; if(quick)detectQuickLogin();else newQR(); }
    function setStatus(text,type="pending"){ $("status").textContent=text; $("status").className=`status ${type}`; }
    function setQRWaiting(label="等待手机确认授权"){ const wrap=$("qrWrap"); wrap.classList.add("waiting-confirm"); wrap.dataset.waitingLabel=label; }
    function clearQRWaiting(){ const wrap=$("qrWrap"); wrap.classList.remove("waiting-confirm"); delete wrap.dataset.waitingLabel; }
    function setMessage(text,type=""){ $("actionMessage").textContent=text; $("actionMessage").className=`message ${type}`; }
    function showMode(mode){ const quick=mode==="quick" && PC_LOGIN_ENABLED; $("quickPane").hidden=!quick; $("qrPane").hidden=quick; $("quickModeBtn").setAttribute("aria-selected",String(quick)); $("qrModeBtn").setAttribute("aria-selected",String(!quick)); if(quick){stopTimers();sid=null;if(!quickConfig&&!quickBusy)detectQuickLogin();}else if(!sid){newQR();} }
    function resetAccount(){ account=null; $("accountBox").classList.remove("visible"); $("accountPlaceholder").hidden=false; setMessage(""); }
    function showAccount(nextAccount){ account=nextAccount; $("accountName").textContent=account.remark||account.nickname||account.alias||account.openid; $("accountId").textContent=String(account.id); $("accountOpenid").textContent=account.openid||"-"; $("accountStatus").textContent=account.status||"unknown"; $("remarkInput").value=account.remark||""; $("accountPlaceholder").hidden=true; $("accountBox").classList.add("visible"); }
    function setQuickState(name,detail,avatar){ $("quickName").textContent=name; $("quickDetail").textContent=detail; if(avatar){ const img=document.createElement("img"); img.className="quick-avatar"; img.alt="微信头像"; img.src=avatar; $("quickAvatar").replaceWith(img); img.id="quickAvatar"; }else if($("quickAvatar").tagName==="IMG"){ const div=document.createElement("div"); div.className="quick-avatar"; div.id="quickAvatar"; div.textContent="微"; $("quickAvatar").replaceWith(div); } }
    function parseLocalResponse(text){ let value=JSON.parse(text); if(typeof value==="string") value=JSON.parse(value); return value; }
    async function localWechat(port,path,body,timeout=3000){ const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),timeout); try{ const response=await fetch(`https://localhost.weixin.qq.com:${port}${path}`,{method:"POST",cache:"no-store",headers:{"Content-Type":"application/json"},body:JSON.stringify(body),signal:controller.signal}); if(!response.ok) throw new Error(`HTTP ${response.status}`); return parseLocalResponse(await response.text()); }finally{clearTimeout(timer);} }
    function checkLoginBody(){ return {apiname:"qrconnectchecklogin",jsdata:{appid:quickConfig.appid,scope:quickConfig.scope,redirect_uri:quickConfig.redirect_uri,state:quickConfig.state}}; }
    async function detectQuickLogin(){ if(quickBusy)return; quickBusy=true; quickConfig=null; quickPort=null; quickProfile=null; $("quickAuthBtn").disabled=true; setQuickState("正在检测本机微信","请保持电脑微信已登录且未锁定"); try{ quickConfig=await api("POST","/quick-login",proxyPayload()); const results=await Promise.all(quickConfig.ports.map(async port=>{try{return {port,data:await localWechat(port,"/api/check-login",checkLoginBody())};}catch{return null;}})); const match=results.find(item=>item&&Number(item.data?.errcode)===0&&item.data?.jsdata?.authorize_uuid); if(!match) throw new Error("未检测到可用的桌面微信"); quickPort=match.port; quickProfile=match.data.jsdata; setQuickState(quickProfile.nickname||"本机微信已就绪","点击下方按钮后在电脑微信中确认",quickProfile.headimgurl||""); $("quickAuthBtn").disabled=false; }catch(error){ quickConfig=null; setQuickState("本机快速授权不可用","已切换到扫码授权"); setTimeout(()=>showMode("qr"),500); }finally{quickBusy=false;} }
    function authorizePosition(){ const width=360,height=263,left=window.screenX||window.screenLeft||0,top=window.screenY||window.screenTop||0; return {x:Math.round(left+(window.outerWidth||window.innerWidth)/2-width/2),y:Math.round(top+(window.outerHeight||window.innerHeight)/2-height/2)}; }
	async function authorizeQuick(){ if(!quickConfig||!quickPort||!quickProfile||quickBusy)return; quickBusy=true; const button=$("quickAuthBtn"); button.disabled=true; button.textContent="等待微信确认"; resetAccount(); try{ const result=await localWechat(quickPort,"/api/authorize",{apiname:"qrconnectfastauthorize",jsdata:{data:JSON.stringify(authorizePosition()),appid:quickConfig.appid,scope:quickConfig.scope,redirect_uri:quickConfig.redirect_uri,state:quickConfig.state,authorize_uuid:quickProfile.authorize_uuid}},120000); const errcode=Number(result?.errcode); if(errcode===10050) throw new Error("已在微信中拒绝授权，请重新检测"); if(errcode===10046) throw new Error("授权已超时，请重新检测"); if(errcode===10057){ showMode("qr"); throw new Error("当前应用仅支持扫码授权"); } if(errcode!==0||!result?.jsdata?.redirect_url) throw new Error("桌面微信未返回有效授权结果，请重新检测"); setQuickState("授权成功","正在保存账号",quickProfile.headimgurl||""); const nextAccount=await api("POST",`/quick-login/${quickConfig.session_id}/confirm`,{redirect_url:result.jsdata.redirect_url}); showAccount(nextAccount); setQuickState("账号添加成功",nextAccount.remark||nextAccount.nickname||nextAccount.openid,quickProfile.headimgurl||"");$('scanProxyMessage').textContent=`授权完成。新账号使用 ${proxyChoiceLabel()}，已有账号保留原代理。`; }catch(error){ setQuickState("快速授权失败",error.message,quickProfile?.headimgurl||""); quickConfig=null; quickPort=null; quickProfile=null; }finally{quickBusy=false;button.disabled=!quickConfig;button.textContent="使用本机微信授权";} }
    function startCountdown(){ seconds=QR_TTL; $("countdown").textContent=`二维码 ${seconds}s 后自动刷新`; countdownTimer=setInterval(()=>{ seconds-=1; $("countdown").textContent=seconds>0?`二维码 ${seconds}s 后自动刷新`:"二维码已过期，正在刷新"; if(seconds<=0){stopTimers();newQR();} },1000); }
    async function retireQR(){ const previous=sid; sid=null; if(!previous)return; try{ await api("POST",`/qr/${previous}/cancel`); }catch{} }
    async function newQR(){ stopTimers(); await retireQR(); resetAccount(); clearQRWaiting(); $("qrWrap").textContent="正在生成二维码"; $("countdown").textContent=""; setStatus("正在获取二维码"); try{ const result=await api("POST","/qr?as_base64=true",proxyPayload()); sid=result.session_id; clearQRWaiting(); const source=result.image_base64||`${result.image_url}?t=${Date.now()}`; $("qrWrap").innerHTML=`<img src="${source}" alt="微信登录二维码">`; const image=$("qrWrap").querySelector("img"); image.addEventListener("error",()=>{ $("qrWrap").textContent="二维码图片加载失败，请检查反向代理是否转发 /qr/* 路径"; setStatus("二维码会话已创建，但图片无法加载","error"); }); setStatus(result.proxy?`等待扫码 · ${result.proxy}`:"等待扫码"); startCountdown(); pollTimer=setInterval(poll,1500); }catch(error){setStatus(`获取二维码失败：${error.message}`,"error");} }
    async function poll(){ if(!sid)return; try{ const result=await api("GET",`/qr/${sid}/poll`); if(result.status==="pending"){clearQRWaiting();setStatus("等待扫码");} else if(result.status==="scanned"){setQRWaiting();setStatus("已扫码，请在手机上确认授权","scanned");} else if(result.status==="authorized"||result.status==="confirmed"){setQRWaiting("正在完成授权");stopTimers();confirm();} else if(result.status==="expired"||result.status==="unknown"){stopTimers();setStatus("二维码已失效，正在重新生成","error");newQR();} else if(result.status==="cancelled"){stopTimers();clearQRWaiting();setStatus("已取消，请重新生成二维码","error");} }catch{} }
	async function confirm(){ $("countdown").textContent=""; setQRWaiting("正在保存账号"); setStatus("授权成功，正在保存账号","scanned"); try{ const nextAccount=await api("POST",`/qr/${sid}/confirm`); showAccount(nextAccount); clearQRWaiting(); $("qrWrap").innerHTML='<span class="check">✓</span>'; setStatus(`账号添加成功 · ${proxyChoiceLabel()}（已有账号保留原配置）`,"ok"); }catch(error){clearQRWaiting();setStatus(`保存账号失败：${error.message}`,"error");} }
    async function saveRemark(silent=false){ if(!account)return false; const button=$("saveRemarkBtn"); button.disabled=true; try{ const result=await api("PUT","/accounts/remark",{ref:String(account.id),remark:$("remarkInput").value}); account=result.account; if(!silent) setMessage(result.warning||"备注已保存",result.warning?"error":"ok"); return true; }catch(error){setMessage(`备注保存失败：${error.message}`,"error"); return false;}finally{button.disabled=false;} }
	async function syncAccount(){ if(!account)return; const button=$("syncBtn"); button.disabled=true; button.textContent="正在添加"; setMessage("正在保存备注并同步面板"); try{ if(!await saveRemark(true))return; const result=await api("POST","/api/qinglong/sync",{ref:String(account.id)}); setMessage(result.added?`已添加到面板 YYB_SERVER：账号 ${account.id}`:`面板 YYB_SERVER 已包含账号 ${account.id}，无需重复添加`,"ok"); button.textContent="已添加到面板"; }catch(error){ setMessage(error.message.includes("配置")?"尚未配置自动化面板，请返回控制台填写连接信息。":`同步失败：${error.message}`,"error"); button.textContent="添加到面板"; }finally{button.disabled=false;} }
	if(!PC_LOGIN_ENABLED){ $("quickModeBtn").hidden=true; $("quickPane").hidden=true; }
	$("scanProxyMode").addEventListener("change",toggleProxyFields); $("scanProxyProfile").addEventListener("change",showProxyChoice); $("scanProvince").addEventListener("change",event=>loadScanCities(event.target.value).catch(error=>$('scanProxyMessage').textContent=`城市列表读取失败：${error.message}`)); $("scanCity").addEventListener("change",showProxyChoice); $("scanLocationBtn").addEventListener("click",recommendLocation); $("scanLocationUseBtn").addEventListener("click",()=>useRecommendedLocation().catch(error=>$('scanProxyMessage').textContent=`采用推荐失败：${error.message}`)); $("scanLocationDismissBtn").addEventListener("click",hideLocationSuggestion); $("scanProxyTestBtn").addEventListener("click",testProxy); $("scanProxyApplyBtn").addEventListener("click",applyProxy); $("quickModeBtn").addEventListener("click",()=>showMode("quick")); $("qrModeBtn").addEventListener("click",()=>showMode("qr")); $("quickAuthBtn").addEventListener("click",authorizeQuick); $("quickRetryBtn").addEventListener("click",detectQuickLogin); $("refreshBtn").addEventListener("click",newQR); $("backBtn").addEventListener("click",async()=>{stopTimers();await retireQR();location.href="/";}); $("saveRemarkBtn").addEventListener("click",()=>saveRemark()); $("syncBtn").addEventListener("click",syncAccount); $("copyBtn").addEventListener("click",async()=>{ try{await navigator.clipboard.writeText(account?.openid||"");setMessage("OpenID 已复制","ok");}catch{setMessage("复制失败，请手动选择 OpenID","error");} });
    toggleProxyFields();
	initializeProxyOptions().finally(()=>showMode(PC_LOGIN_ENABLED?"quick":"qr"));
  </script>
